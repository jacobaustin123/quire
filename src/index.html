<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; script-src 'self'">
<title>Quire</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="titlebar">
  <div id="title"><span id="doc-name">Untitled</span><span id="doc-edited" aria-label="Edited"></span></div>
  <div id="title-actions">
    <button id="btn-toolbar" class="ghost" title="Formatting (⌘T)" aria-label="Toggle formatting bar"><span class="glyph">Aa</span>
    </button>
    <button id="btn-theme" class="ghost" title="Light / Dark (⇧⌘D)" aria-label="Toggle light or dark">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6"/><path d="M10 4a6 6 0 0 0 0 12z" class="fill"/></svg>
    </button>
  </div>
</header>
<nav id="toolbar" aria-label="Formatting"></nav>
<div id="banner" hidden></div>
<main id="scroller">
  <div id="page"><div id="editor"></div></div>
</main>
<div id="page-indicator" aria-live="polite"></div>
<div id="findbar" class="bar" hidden>
  <input id="find-input" type="text" placeholder="Find" spellcheck="false" autocomplete="off">
  <span id="find-count"></span>
  <button id="find-prev" class="ghost" aria-label="Previous match"><svg viewBox="0 0 20 20"><path d="m5 12.5 5-5 5 5"/></svg></button>
  <button id="find-next" class="ghost" aria-label="Next match"><svg viewBox="0 0 20 20"><path d="m5 7.5 5 5 5-5"/></svg></button>
  <button id="find-close" class="ghost" aria-label="Close find"><svg viewBox="0 0 20 20"><path d="m6 6 8 8M14 6l-8 8"/></svg></button>
</div>
<div id="gotobar" class="bar" hidden>
  <span class="label">Go to page</span>
  <input id="goto-input" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" aria-label="Page number">
  <span id="goto-total"></span>
  <kbd>↵</kbd>
</div>
<div id="popover" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
