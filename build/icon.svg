<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Quire app icon: a gold fountain-pen nib, set on the diagonal, on an
    even violet tile.
    The nib is drawn upright (tip down at 512,812) and then rotated about its
    visual centre of mass (512,450), so the heavy shoulder end and thin tip
    balance around the tile centre.
    Tile: macOS icon grid, an 824px continuous-corner squircle (radius 185,
    60% smoothing) centred on a 1024 canvas.
  -->
  <defs>
    <path id="tile-shape" d="M628 100c103.61 0 155.41 0 194.99 20.16a185 185 0 0 1 80.85 80.85c20.16 39.57 20.16 91.38 20.16 194.99V628c0 103.61 0 155.41-20.16 194.99a185 185 0 0 1-80.85 80.85c-39.57 20.16-91.38 20.16-194.99 20.16H396c-103.61 0-155.41 0-194.99-20.16a185 185 0 0 1-80.85-80.85C100 783.41 100 731.61 100 628V396c0-103.61 0-155.41 20.16-194.99a185 185 0 0 1 80.85-80.85C240.59 100 292.39 100 396 100Z"/>
    <clipPath id="tile-clip"><use href="#tile-shape"/></clipPath>

    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nib-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24135f" flood-opacity="0.28"/>
    </filter>

    <!-- An even violet: just enough tonal shift to feel lit, no dark vignette. -->
    <linearGradient id="twilight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d63f3"/>
      <stop offset="1" stop-color="#5b40dc"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </linearGradient>

    <!-- The two halves of the nib catch the light differently, giving it a ridge. -->
    <linearGradient id="gold-lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5d6"/>
      <stop offset="0.45" stop-color="#f6d27a"/>
      <stop offset="1" stop-color="#d49b38"/>
    </linearGradient>
    <linearGradient id="gold-shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab655"/>
      <stop offset="0.55" stop-color="#c08427"/>
      <stop offset="1" stop-color="#8a5514"/>
    </linearGradient>
  </defs>

  <use href="#tile-shape" fill="#5b40dc" filter="url(#tile-shadow)"/>

  <g clip-path="url(#tile-clip)">
    <rect width="1024" height="1024" fill="url(#twilight)"/>

    <g transform="translate(0 62) rotate(40 512 450)">
      <g filter="url(#nib-shadow)">
        <path fill="url(#gold-lit)" d="M512 222C448 222 408 230 396 252L388 372C402 374 412 384 414 400C412 520 454 680 512 812Z"/>
        <path fill="url(#gold-shade)" d="M512 222C576 222 616 230 628 252L636 372C622 374 612 384 610 400C612 520 570 680 512 812Z"/>
      </g>
      <!-- Engraved line across the shoulder. -->
      <path d="M414 296Q512 326 610 296" fill="none" stroke="#9b6a1f" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
      <!-- Breather hole and slit. -->
      <circle cx="512" cy="500" r="22" fill="#3b2596"/>
      <path d="M512 520V812" stroke="#3b2596" stroke-width="7"/>
    </g>
  </g>

  <use href="#tile-shape" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
